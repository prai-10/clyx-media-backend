services:
  - type: web
    name: clyx-media-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_BUCKET
        value: site-images
      - key: ADMIN_USERNAME
        value: admin
      # Secrets: paste the values in the Render dashboard (they are not stored in this file).
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      # Your Vercel site, e.g. https://clyx-media.vercel.app (comma-separate several).
      - key: CORS_ORIGIN
        sync: false
      # Careers apply form: Resend API key (clyxmedia.com must be verified in Resend).
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Clyx Careers <careers@clyxmedia.com>
      # Applications go to this inbox, and candidates get their confirmation from it.
      - key: CAREERS_TO_EMAIL
        value: CLYX Media Careers <hr@clyxmedia.com>
      # Contact form, newsletter and "Email Founders": team inbox; visitors get their reply from it.
      - key: CONTACT_FROM
        value: Clyx Website <website@clyxmedia.com>
      - key: CONTACT_TO_EMAIL
        value: CLYX Media <work@clyxmedia.com>
